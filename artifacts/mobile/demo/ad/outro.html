<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 412px; height: 892px; overflow: hidden; background: #071226; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .stage { position: relative; width: 412px; height: 892px; overflow: hidden;
    background: linear-gradient(160deg, #071226 0%, #0c2c52 45%, #11406e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 34px; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .32; }
  .orb1 { width: 340px; height: 340px; background: #3b82f6; top: -80px; left: -100px; }
  .orb2 { width: 300px; height: 300px; background: #38bdf8; bottom: -60px; right: -90px; }

  .logoWrap { width: 160px; height: 160px; border-radius: 38px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.1); opacity: 0;
    animation: pop 1s cubic-bezier(.2,1.4,.4,1) .5s forwards; }
  .logoWrap img { width: 160px; height: 160px; object-fit: cover; display: block; }
  h1 { margin-top: 26px; color: #fff; font-size: 40px; font-weight: 800; letter-spacing: 3px; opacity: 0;
    animation: rise .8s ease 1.1s forwards; }
  h1 span { color: #ef4444; }
  .tag { margin-top: 16px; color: #d5e8fa; font-size: 19px; line-height: 1.55; opacity: 0;
    animation: rise .8s ease 1.6s forwards; }
  .tag em { font-style: normal; color: #7dd3fc; font-weight: 700; }
  .stores { margin-top: 44px; display: flex; gap: 14px; opacity: 0; animation: rise .8s ease 2.3s forwards; }
  .store { border: 1px solid rgba(255,255,255,.3); border-radius: 14px; padding: 13px 20px;
    color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,.06); }
  .store svg { width: 20px; height: 20px; fill: #fff; }
  .site { margin-top: 34px; color: #7dd3fc; font-size: 18px; letter-spacing: 2px; font-weight: 600; opacity: 0;
    animation: rise .8s ease 2.9s forwards; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes rise { 0% { opacity: 0; transform: translateY(26px); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="stage">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="logoWrap"><img src="carnet-logo.png" alt="CARNET"></div>
  <h1>CARNET</h1>
  <div class="tag">Innovation in <em>healthcare management</em><br>&amp; <em>patient record digitalization</em></div>
  <div class="stores">
    <div class="store">
      <svg viewBox="0 0 24 24"><path d="M18.7 12.5c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.7.9-.8 0-2-.9-3.3-.9-1.7 0-3.2 1-4.1 2.5-1.7 3-0.4 7.5 1.3 9.9.8 1.2 1.8 2.5 3.1 2.5 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.3.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-3.9zM16.2 4.9c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.8-1.5z"/></svg>
      App Store
    </div>
    <div class="store">
      <svg viewBox="0 0 24 24"><path d="M3.6 1.8L13.7 12 3.6 22.2c-.4-.2-.6-.6-.6-1.1V2.9c0-.5.2-.9.6-1.1zm11.5 11.6l2.6 2.6-11 6.3c-.4.2-.9.3-1.3.1l9.7-9zm4-2.9l2.4 1.4c.9.5.9 1.7 0 2.2l-2.4 1.4-2.9-2.5 2.9-2.5zM5.4 1.6c.4-.2.9-.1 1.3.1l11 6.3-2.6 2.6-9.7-9z"/></svg>
      Google Play
    </div>
  </div>
  <div class="site">www.navimedi.org</div>
</div>
</body>
</html>
